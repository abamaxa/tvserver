name: Android Kotlin tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite (media timing is opt-in because capture timing varies on CI)
        type: choice
        options: [regression, media-timing]
        default: regression

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite || 'regression' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NDK_VERSION: '26.2.11394342'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test release signing prerequisites
        run: python3 -B -m unittest discover -s tests -p "android_*_test.py" -v
      - name: Prepare shared Android debug signing key
        # Create this before Tauri caches a signed debug APK so the app and
        # instrumentation APKs use the same certificate on every device shard.
        run: python3 -B tests/android_release_runtime_smoke.py --prepare-signing-key
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=x86_64-linux-android24" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native binding generator
        run: cargo install bindgen-cli --version 0.72.1 --locked
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare standalone native test build
        run: |
          # Gradle invokes this npm script when building the Rust JNI bridge.
          # No checkout or credentials for the private frontend are needed.
          cat > package.json <<'JSON'
          {"private":true,"scripts":{"tauri":"tauri"},"devDependencies":{"@tauri-apps/cli":"2.11.4"}}
          JSON
          npm install --ignore-scripts --no-package-lock
          mkdir -p "$RUNNER_TEMP/android-test-frontend"
          printf '<!doctype html><title>Native instrumentation tests</title>\n' > "$RUNNER_TEMP/android-test-frontend/index.html"
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'android-test.conf.json'), JSON.stringify({
            build: {
              beforeBuildCommand: '',
              frontendDist: path.join(process.env.RUNNER_TEMP, 'android-test-frontend'),
            },
          }));
          JS
      - name: Build native test app
        run: npm run tauri -- android build --debug --target x86_64 --apk --ci --config "$RUNNER_TEMP/android-test.conf.json"
      - name: Run storage migration unit tests
        working-directory: gen/android
        run: ./gradlew --no-daemon :app:testUniversalDebugUnitTest -x :app:rustBuildUniversalDebug -PabiList=x86_64
      - name: Build and verify instrumentation APK signatures
        working-directory: gen/android
        run: |
          # Verify that the reusable app and instrumentation APKs match.
          ./gradlew --no-daemon :app:assembleUniversalDebug :app:assembleUniversalDebugAndroidTest \
            -x :app:rustBuildUniversalDebug -PabiList=x86_64 \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            -Pandroid.injected.signing.store.type=JKS
          expected_certificate=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          for apk in app/build/outputs/apk/universal/debug/app-universal-debug.apk app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk; do
            actual_certificate=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [[ "$actual_certificate" != "$expected_certificate" ]]; then
              echo "::error::APK signing certificate does not match the shared debug key: $apk"
              exit 1
            fi
          done
      - name: Build minified release APK
        working-directory: gen/android
        run: ./gradlew --no-daemon :app:assembleUniversalRelease -x :app:rustBuildUniversalRelease -PabiList=x86_64
      - name: Stage APKs for device jobs
        run: |
          mkdir -p "$RUNNER_TEMP/android-test-apks"
          cp gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk "$RUNNER_TEMP/android-test-apks/app-debug.apk"
          cp gen/android/app/build/outputs/apk/androidTest/universal/debug/app-universal-debug-androidTest.apk "$RUNNER_TEMP/android-test-apks/app-test.apk"
          cp gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk "$RUNNER_TEMP/android-test-apks/app-release.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apks
          path: ${{ runner.temp }}/android-test-apks/
          compression-level: 0
          retention-days: 3
      - name: Upload build test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-test-reports
          path: |
            gen/android/app/build/reports/tests/
            gen/android/app/build/test-results/
          if-no-files-found: warn

  device:
    name: ${{ inputs.suite == 'media-timing' && 'Manual media timing' || format('Device tests ({0}/3)', matrix.shard) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.suite == 'media-timing' && '[1]' || '[1,2,3]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: android-test-apks
          path: android-test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Kotlin instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swangle -skin 540x1170 -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            # Preserve Pixel 5's logical layout with 75% fewer rendered pixels.
            adb shell wm density 220
            python3 tests/android_instrumentation.py --serial emulator-5554 --shard ${{ matrix.shard }} --suite ${{ inputs.suite || 'regression' }}
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports-${{ matrix.shard }}
          path: android-device-reports/
          if-no-files-found: warn

  test:
    # Preserve the existing required check name while waiting for every shard.
    name: ${{ inputs.suite == 'media-timing' && 'manual timing result' || 'test' }}
    if: always()
    needs: [build, device]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build and device jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEVICE_RESULT: ${{ needs.device.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$DEVICE_RESULT" = success
