name: Android Kotlin tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: '26.2.11394342'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test release signing prerequisites
        run: python3 -B -m unittest discover -s tests -p android_release_runtime_smoke_test.py -v
      - name: Prepare shared Android debug signing key
        # Create this before Tauri caches a signed debug APK so the release probe
        # and later Gradle instrumentation use the same certificate.
        run: python3 -B tests/android_release_runtime_smoke.py --prepare-signing-key
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake ninja-build
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=x86_64-linux-android24" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install native binding generator
        run: cargo install bindgen-cli --version 0.72.1 --locked
      - uses: gradle/actions/setup-gradle@v5
      - name: Prepare standalone native test build
        run: |
          # Gradle invokes this npm script when building the Rust JNI bridge.
          # No checkout or credentials for the private frontend are needed.
          cat > package.json <<'JSON'
          {"private":true,"scripts":{"tauri":"tauri"},"devDependencies":{"@tauri-apps/cli":"2.11.4"}}
          JSON
          npm install --ignore-scripts --no-package-lock
          mkdir -p "$RUNNER_TEMP/android-test-frontend"
          printf '<!doctype html><title>Native instrumentation tests</title>\n' > "$RUNNER_TEMP/android-test-frontend/index.html"
          node - <<'JS'
          const fs = require('node:fs');
          const path = require('node:path');
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'android-test.conf.json'), JSON.stringify({
            build: {
              beforeBuildCommand: '',
              frontendDist: path.join(process.env.RUNNER_TEMP, 'android-test-frontend'),
            },
          }));
          JS
      - name: Build native test app
        run: npm run tauri -- android build --debug --target x86_64 --apk --ci --config "$RUNNER_TEMP/android-test.conf.json"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Kotlin instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          working-directory: gen/android
          script: |
            # Reuse the JNI bridge already built above; the regression exercises
            # the release-minified Java extraction path with fresh runtime data.
            ./gradlew --no-daemon :app:assembleUniversalRelease -x :app:rustBuildUniversalRelease -PabiList=x86_64
            python3 ../../tests/android_release_runtime_smoke.py --serial emulator-5554 --apk app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
            ./gradlew --no-daemon :app:connectedUniversalDebugAndroidTest -x :app:rustBuildUniversalDebug -PabiList=x86_64
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            gen/android/app/build/reports/androidTests/
            gen/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
