name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Setup | Checkout
      uses: actions/checkout@v6
    - name: Setup | Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
    - name: Test GitHub automation
      run: node --test .github/scripts/*.test.cjs
    - name: Setup | FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    - name: Setup | Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Build
      run: make build
    - name: Run unit tests
      run: make test-unit
    - name: Test SoundCloud search metadata
      run: python3 -B -m unittest discover -s tests -p soundcloud_search_test.py
    - name: Test SoundCloud download formats
      env:
        DOWNLOAD_DIR: ${{ runner.temp }}/tvserver-soundcloud-downloads
        PYTHONPATH: ${{ github.workspace }}/gen/android/app/src/main/assets/ytdlp/yt-dlp
      run: cargo test --no-default-features --features webserver --lib adaptors::youtube_fetcher::tests::soundcloud_ -- --include-ignored
    - name: Run integration tests
      run: make test-integration
