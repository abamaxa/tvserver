[package]
name = "tvserver"
version = "0.8.1"
edition = "2021"
authors = ["Chris Morgan <cmorgan@abamaxa.com>"]
repository = "https://github.com/abamaxa/tvserver"
license = "MIT"
readme = "README.md"
description = "Transmission JRPC client"
keywords = ["transmission", "torrent", "youtube", "ffmpeg"]
default-run = "tvserver"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.59"
async-recursion = "1.0.4"
async-trait = "0.1.64"
base64 = "0.22"
axum = { version = "0.8.1", features = ["ws", "macros", "tokio"] }
bytesize = {version = "1.1.0", features = ["serde"] }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chrono = {version = "0.4.25", features= ["serde"] }
futures = "0.3" 
html-escape = "0.2.13"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
resvg = { version = "0.47", default-features = false, features = ["raster-images", "text"] }
mockall = "0.11.3"
lazy_static = "1.5.0"
quick-xml = { version = "0.37", features = ["encoding"] }
rand = "0.8.5"
regex = "1.7.1"
reqwest = { version = "0.11.20", features = ["json", "rustls-tls"], default-features = false }
scraper = "0.15.0"
serde = { version = "1.0.138", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0.0"
sha2 = "0.10"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "chrono", "sqlite", "migrate", "json"] }
thiserror = "1.0.40"
tokio = { version = "1.25.0", features = ["full"] }
tokio-util = "0.7.4"
tower-http = { version = "0.6.1", features = ["fs", "trace", "cors"] }
titlecase = "2.2.1"
tracing = "0.1.35"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
transmission-rpc = "0.4.1"
urlencoding = "2.1.2"
itertools = "0.11.0"
librqbit = { version = "8.0.0", features = ["rust-tls"], default-features = false }
num_cpus = "1.16.0"
once_cell = "1.21.3"
# tauri - only include when webserver feature is not enabled
log = { version = "0.4", optional = true }
tauri = { version = "2.11.5", features = ["protocol-asset"], optional = true }
tauri-plugin-log = { version = "2.8.0", optional = true }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [], optional = true }

[dev-dependencies]
oas3 = { version = "0.22", features = ["yaml-spec"] }
roas = { version = "=0.17.2", default-features = false, features = ["v3_1"] }
serde_yaml = "0.9"

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "unwind"
strip = true # Ensures debug symbols are removed.

[features]
vlc = []
ai-descriptions = []
webserver = []
# Default features - include Tauri dependencies when webserver is not enabled
default = ["tauri", "tauri-plugin-log", "log", "tauri-build"]

[target.'cfg(any(target_os = "android", target_os = "linux", target_vendor = "apple"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
