[package]
name = "tvserver"
version = "0.8.0"
edition = "2021"
authors = ["Chris Morgan <cmorgan@abamaxa.com>"]
repository = "https://github.com/abamaxa/tvserver"
license = "MIT"
readme = "README.md"
description = "Transmission JRPC client"
keywords = ["transmission", "torrent", "youtube", "ffmpeg"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
async-recursion = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws", "macros", "tokio"]}  # "headers",
bytesize = {version = "1.3", features = ["serde"]}
chrono = {version = "0.4", features=["serde"]}
futures = "0.3"
html-escape = "0.2"
mockall = "0.12"
rand = "0.8"
regex = "1.10"
reqwest = { version = "0.12", features = ["json"] }
scraper = "0.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "chrono", "sqlite", "migrate", "json"] }
thiserror = "1.0"
tokio = { version = "1.37", features = ["full"] }
tokio-util = "0.7.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tower = { version = "0.4", features = ["util"] }
titlecase = "3.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
transmission-rpc = "0.4"
urlencoding = "2.1"
itertools = "0.12"

[profile.release]
strip = "debuginfo"
#opt-level = 'z'  # Optimize for size
opt-level = 3  # Optimize for speed
lto = true       # Enable Link Time Optimization
codegen-units = 1  # Reduce parallel code generation units
debug = false    # No debug info
rpath = false    # Do not store the library path

[features]
vlc = []
